<style>
  :root { color-scheme: light dark; }
  body {
    font: 12px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    margin: 0;
    padding: 12px;
  }
  h3 { margin: 0 0 4px; font-size: 13px; }
  p.meta { margin: 0 0 8px; opacity: 0.7; }
  textarea {
    width: 100%;
    height: 480px;
    box-sizing: border-box;
    font-family: ui-monospace, 'SF Mono', Menlo, monospace;
    font-size: 11px;
    border: 1px solid rgba(128, 128, 128, 0.4);
    border-radius: 6px;
    padding: 8px;
    resize: vertical;
  }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  button {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid rgba(128, 128, 128, 0.4);
    background: #0d99ff;
    color: #fff;
    font-weight: 600;
    cursor: pointer;
  }
  button.secondary { background: transparent; color: inherit; }
  span.status { opacity: 0.7; }
</style>

<h3>Pages in this file</h3>
<p class="meta" id="meta">Reading…</p>
<textarea id="out" readonly></textarea>
<div class="row">
  <button id="copy">Copy all</button>
  <button class="secondary" id="toggle">Show JSON</button>
  <span class="status" id="status"></span>
</div>

<script>
  let pagesData = [];
  let showJson = false;

  function render() {
    const out = document.getElementById('out');
    if (showJson) {
      out.value = JSON.stringify(pagesData, null, 2);
    } else {
      out.value = pagesData
        .map((p) => {
          const head = `${p.name}\t${p.id}\t${p.url || ''}`;
          const kids = (p.frames || [])
            .map((f) => `    └ ${f.name}\t${f.id}`)
            .join('\n');
          return kids ? `${head}\n${kids}` : head;
        })
        .join('\n');
    }
  }

  onmessage = (e) => {
    const msg = e.data.pluginMessage;
    if (!msg) return;
    pagesData = msg.pages;
    document.getElementById('meta').textContent =
      `${msg.pages.length} pages · fileKey: ${msg.fileKey || '(unavailable — links omit it)'}`;
    render();
  };

  document.getElementById('copy').onclick = () => {
    const ta = document.getElementById('out');
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    document.execCommand('copy');
    document.getElementById('status').textContent = 'Copied ✓';
    setTimeout(() => (document.getElementById('status').textContent = ''), 2000);
  };

  document.getElementById('toggle').onclick = () => {
    showJson = !showJson;
    document.getElementById('toggle').textContent = showJson ? 'Show table' : 'Show JSON';
    render();
  };
</script>
